[package]
name = "dispost"
description = "An event bus based on strongly consistent distributed data structures"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/michel-kraemer/dispost"
keywords = ["event bus", "raft", "consistency", "cluster", "distributed"]
categories = ["network-programming", "asynchronous"]

[dependencies]
dashmap = "6.2.1"
distruct = "0.1.0"
log = "0.4.34"
postcard = { version = "1.1.3", features = ["alloc"] }
quinn = "0.11.11"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
tokio = { version = "1.54.0", features = ["macros", "net", "parking_lot", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
ulid = "3.0.0"

[workspace]
members = ["examples/chat"]
